<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ParkYa</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/ParkYa/wwwroot/css/registro.css">
</head>
<body>

<div class="d-flex justify-content-center align-items-center min-vh-100">

    <div class="registro-container col-11 col-sm-10 col-md-8 col-lg-6">

        <button class="btn-volver" onclick="location.href='index.html'">← Volver</button>

        <img src="/ParkYa/wwwroot/assets/logo1.jpeg" class="logo">

        <h1>Registro de Nuevo Cliente</h1>
        <p class="sub">Completa tus datos para crear tu cuenta en PARKYA</p>

        <form>
            <div class="form-grid">

                <div>
                    <label for="fullName">Nombre</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Ej: María" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" minlength="3">
                </div>

                <div>
                    <label for="lastName">Apellido</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Ej: Gómez" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" minlength="3">
                </div>

                <div>
                    <label for="doctype">Tipo de documento</label>
                    <select id="doctype" name="doctype" required>
                        <option selected disabled>Selecciona tipo</option>
                        <option value="CC">Cédula de Ciudadanía</option>
                        <option value="TI">Tarjeta de Identidad</option>
                        <option value="CE">Cédula Extranjera</option>
                    </select>
                </div>

                <div>
                    <label for="document">Número de documento</label>
                    <input type="text" id="document" name="document" placeholder="Ej: 1156015225" required minlength="7" pattern="[0-9]+">
                </div>

                <div>
                    <label for="vehiculo">Tipo de Vehículo</label>
                    <select id="vehiculo" name="vehiculo" required>
                        <option selected disabled>Selecciona tipo de vehículo</option>
                        <option value="1">Bicicleta</option>
                        <option value="2">Moto</option>
                        <option value="3">Automóvil</option>
                        <option value="4">Camioneta</option>
                        <option value="5">Camión</option>
                    </select>
                </div>

                <div>
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="correo@example.com" required>
                </div>

                <div>
                    <label for="phone">Teléfono</label>
                    <input type="text" id="phone" name="phone" placeholder="Ej: 3174567592" required minlength="7" pattern="[0-9]+">
                </div>

                

                <!-- CONTRASEÑA -->
                <div>
                    <label for="password">Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="Crea una contraseña" minlength="6" required>
                        <svg id="togglePass1" class="icon-eye" viewBox="0 0 24 24">
                            <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7z" stroke="currentColor" stroke-width="2" fill="none"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                    </div>
                </div>

                <!-- CONFIRMAR CONTRASEÑA -->
                <div>
                    <label for="confirmpassword">Confirmar contraseña</label>
                    <div class="password-container">
                        <input type="password" id="confirmpassword" name="confirmpassword" placeholder="Repite la contraseña" minlength="6" required>
                        <svg id="togglePass2" class="icon-eye" viewBox="0 0 24 24">
                            <path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7z" stroke="currentColor" stroke-width="2" fill="none"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                    </div>
                </div>

                <button class="btn-submit" type="submit">Crear Cuenta</button>

                <p class="tienes-cuenta">
                    ¿Ya tienes cuenta?
                    <a href="/views/html/login.html">Inicia sesión</a>
                </p>

            </div>
        </form>

    </div>
</div>

<script>
function togglePassword(passId, iconId) {
    const pass = document.getElementById(passId);
    const icon = document.getElementById(iconId);
    let visible = false;

    icon.onclick = () => {
        visible = !visible;
        pass.type = visible ? "text" : "password";

        icon.innerHTML = visible
            ? `<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z" stroke="currentColor" stroke-width="2" fill="none"/>
               <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2"/>`
            : `<path d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7z" stroke="currentColor" stroke-width="2" fill="none"/>
               <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>`;
    };
}

togglePassword("password", "togglePass1");
togglePassword("confirmpassword", "togglePass2");
</script>

</body>
</html>
